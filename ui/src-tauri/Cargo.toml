[package]
name = "infra-sentinel-desktop"
version = "0.1.0"
description = "Cross-platform desktop shell for Infra Sentinel"
authors = ["Infra Sentinel contributors"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
