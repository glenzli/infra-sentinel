# Managed by Traffic Sentinel Settings.
# Local Mihomo discovery, sampling frequency, remote endpoints, and log
# retention are fixed product behavior rather than user configuration.

[monitor]
warning_window_minutes = 5
warning_mib = 250
critical_window_minutes = 10
critical_mib = 1024

[remote]
enabled = false
ssh_host = ""
xray_stats_enabled = false
billing_cycle_start_day = 1
billing_mode = "both"
