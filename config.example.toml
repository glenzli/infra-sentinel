# Managed by Infra Sentinel. Schema identifiers use YYYYMMDD.revision.
# Local Mihomo discovery and sampling frequency are fixed product behavior.
schema_version = "20260811.1"

[app]
menu_bar_mode = "health"

# Leave empty for automatic discovery. Absolute paths are useful when Windows
# installers or portable applications use non-standard locations.
[integrations]
ssh_executable = ""
opencode_executable = ""
opencode_database = ""
# Legacy compatibility field; Codex usage no longer reads a database.
codex_database = ""

[[policies]]
id = "network-traffic-alerts"
kind = "traffic.threshold"
resource_id = "network"
warning_window_minutes = 5
warning_mib = 250
critical_window_minutes = 10
critical_mib = 1024

[[sources]]
id = "local-mihomo"
kind = "network.mihomo"
enabled = true
